name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref, so superseded runs
# don't keep burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The in-process cross-server integration tests (runCrossServerTest's FetchBuildings(conn, 15s)
      # round-trip) used to be a timing flake here: they dialed a real-TCP fake game server, and on
      # the 2-vCPU runner under -race the server goroutine could be starved past the 15s deadline,
      # which os.Exit(1)s the whole test binary (a bare "FAIL" with no `--- FAIL:` line). That forced
      # a 3x retry loop on this job. Those tests now run the entire round-trip over an in-memory
      # net.Pipe transport inside a testing/synctest bubble (virtual time -- see NewInMemoryGameDial
      # and UseInMemoryGSL), so the deadline is deterministic and cannot be starved regardless of
      # runner load. No retry needed; a failure here is a real failure.
      - run: go test ./... -race -cover

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz DecodeObject (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzDecodeObject -fuzztime=15s -parallel=2 ./internal/sfs
      - name: Fuzz ReadPacket (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzReadPacket -fuzztime=15s -parallel=2 ./internal/sfs

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
