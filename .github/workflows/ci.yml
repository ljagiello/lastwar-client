name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover
      - name: Fuzz DecodeObject (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzDecodeObject -fuzztime=15s .
      - name: Fuzz ReadPacket (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzReadPacket -fuzztime=15s .
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
