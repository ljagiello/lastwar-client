name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref, so superseded runs
# don't keep burning runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0

  test:
    name: test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # -p 1 runs one package's test binary at a time. The GitHub runner has only 2 vCPUs, and a few
      # app-package tests drive the CLI's cross-server/interactive flows in-process -- functions that
      # os.Exit(1) on a "connection appears dead" timeout. With several -race binaries running at once
      # (default -p = GOMAXPROCS = 2), the app test's in-memory fake-server goroutine can be starved
      # long enough to trip that timeout, which os.Exits the whole binary (a bare "FAIL" with no
      # --- FAIL line). App tests use no t.Parallel(), so serializing packages removes the contention
      # without hiding any real failure.
      - run: go test ./... -race -cover -p 1

  fuzz:
    name: fuzz (short)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fuzz DecodeObject (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzDecodeObject -fuzztime=15s -parallel=2 ./internal/sfs
      - name: Fuzz ReadPacket (short, defense-in-depth)
        run: go test -run=^$ -fuzz=FuzzReadPacket -fuzztime=15s -parallel=2 ./internal/sfs

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
